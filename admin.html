<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Danfrolat Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#58CC02;--green-dark:#46A302;--green-light:#E8F5D9;
    --blue:#1CB0F6;--blue-dark:#1899D6;--blue-light:#E7F7FF;
    --red:#FF4B4B;--red-dark:#EA2B2B;--red-light:#FFE5E5;
    --yellow:#FFC800;--yellow-dark:#E5A000;--yellow-light:#FFF8E0;
    --purple:#CE82FF;--purple-light:#F3E5FF;
    --gray:#E5E5E5;--gray-dark:#CACACA;--gray-text:#777;
    --bg:#F7F7F7;--text:#3C3C3C;
    --ease:cubic-bezier(0.25,0.8,0.25,1);
    --spring:cubic-bezier(0.34,1.56,0.64,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{font-family:'Nunito',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;user-select:none}
  body{display:flex;justify-content:center}
  .app{width:100%;max-width:560px;min-height:100vh;background:var(--bg);position:relative;padding-bottom:40px}

  #loadingScreen{position:fixed;inset:0;background:linear-gradient(180deg,#FFF 0%,#E8F5D9 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
  #loadingScreen.hide{opacity:0;pointer-events:none}
  .load-mascot{width:100px;height:100px;animation:bounce 2s ease-in-out infinite;margin-bottom:16px;filter:drop-shadow(0 10px 20px rgba(160,82,45,.2))}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
  .load-text{font-weight:800;color:var(--gray-text);font-size:14px;margin-bottom:20px}
  .load-bar{width:220px;height:8px;background:var(--gray);border-radius:10px;overflow:hidden}
  .load-bar-fill{height:100%;background:var(--green);border-radius:10px;width:30%;animation:loadSlide 1.4s ease-in-out infinite}
  @keyframes loadSlide{0%{width:10%}50%{width:70%}100%{width:95%}}

  #lockedScreen{display:none;padding:40px 20px;text-align:center;min-height:100vh;flex-direction:column;align-items:center;justify-content:center}
  #lockedScreen.show{display:flex}
  .lock-icon{font-size:70px;margin-bottom:16px;animation:lockWobble 2s ease-in-out infinite}
  @keyframes lockWobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .lock-title{font-size:26px;font-weight:900;margin-bottom:8px;color:var(--text)}
  .lock-sub{font-size:14px;color:var(--gray-text);font-weight:700;margin-bottom:28px;max-width:340px;line-height:1.5}
  .device-card{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.08);margin-bottom:20px}
  .device-label{font-size:11px;font-weight:800;color:var(--gray-text);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
  .device-code{font-size:22px;font-weight:900;color:var(--green-dark);font-family:monospace;letter-spacing:2px;padding:14px;background:var(--green-light);border-radius:12px;margin-bottom:14px;word-break:break-all}
  .copy-btn{padding:11px 20px;background:var(--green);color:#fff;border:none;border-radius:10px;font-family:inherit;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;box-shadow:0 3px 0 var(--green-dark);width:100%;transition:all .15s}
  .copy-btn:active{transform:translateY(3px);box-shadow:0 0 0}
  .copy-btn.copied{background:var(--blue);box-shadow:0 3px 0 var(--blue-dark)}
  .lock-info{font-size:12px;color:var(--gray-text);font-weight:700;margin-top:14px;line-height:1.5}
  .go-back-btn{margin-top:12px;padding:12px 24px;background:#fff;border:2px solid var(--gray);color:var(--text);border-radius:12px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 3px 0 var(--gray-dark);text-decoration:none;display:inline-block}
  .go-back-btn:active{transform:translateY(3px);box-shadow:0 0 0}

  .admin-header{background:#fff;border-bottom:2px solid var(--gray);position:sticky;top:0;z-index:50;padding:14px 16px 0;box-shadow:0 2px 12px rgba(0,0,0,.03)}
  .header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mascot{width:38px;height:38px;flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(160,82,45,.2))}
  .brand-text{display:flex;flex-direction:column;line-height:1.1}
  .brand-title{font-weight:900;font-size:17px;letter-spacing:-.3px}
  .brand-sub{font-size:10px;font-weight:800;color:var(--gray-text);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
  .header-stats{display:flex;gap:8px;align-items:center}
  .stat-pill{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:900;border:2px solid transparent;transition:all .3s}
  .stat-pill.pending{background:var(--yellow-light);color:var(--yellow-dark);border-color:#FCE49C}
  .stat-pill.pending.bump{animation:pillBump .5s var(--ease)}
  @keyframes pillBump{0%,100%{transform:scale(1)}30%{transform:scale(1.15)}60%{transform:scale(.95)}}
  .stat-pill.online{background:var(--green-light);color:var(--green-dark);border-color:#C8E9A5}
  .online-dot{width:6px;height:6px;border-radius:50%;background:var(--green-dark);animation:onlinePulse 2s ease-in-out infinite}
  @keyframes onlinePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

  .filter-tabs{display:flex;gap:4px;padding-bottom:14px;overflow-x:auto}
  .filter-tabs::-webkit-scrollbar{display:none}
  .filter-tab{padding:9px 14px;border:2px solid transparent;border-radius:12px;background:var(--bg);font-family:inherit;font-weight:800;font-size:12px;color:var(--gray-text);cursor:pointer;white-space:nowrap;transition:all .25s var(--ease);display:flex;align-items:center;gap:6px}
  .filter-tab:hover{background:#F0F0F0}
  .filter-tab:active{transform:scale(.96)}
  .filter-tab.active{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-dark)}
  .filter-tab.active:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue-dark)}
  .filter-tab[data-filter="forgot"].active{background:var(--purple);box-shadow:0 3px 0 #A855F7}
  .filter-count{background:rgba(255,255,255,.25);padding:1px 6px;border-radius:6px;font-size:10px;font-weight:900;transition:all .2s}
  .filter-tab:not(.active) .filter-count{background:var(--gray);color:var(--text)}
  .filter-tab[data-filter="forgot"]:not(.active) .filter-count{background:var(--purple-light);color:#7B1FA2}

  .feed{padding:16px;display:flex;flex-direction:column;gap:10px;min-height:300px;transition:opacity .2s}
  .request-card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:12px;transition:all .3s var(--ease);animation:cardEnter .45s var(--ease) both;border:2px solid transparent}
  @keyframes cardEnter{0%{opacity:0;transform:translateX(24px) scale(.94)}60%{opacity:1;transform:translateX(-2px) scale(1.02)}100%{opacity:1;transform:translateX(0) scale(1)}}
  .request-card.new{animation:cardNew .7s var(--ease) both}
  @keyframes cardNew{0%{opacity:0;transform:translateX(40px) scale(.9);border-color:var(--green)}50%{border-color:var(--green);box-shadow:0 0 0 4px rgba(88,204,2,.15)}100%{opacity:1;transform:translateX(0) scale(1);border-color:transparent}}
  .request-card.removing{animation:cardLeave .35s var(--ease) forwards}
  @keyframes cardLeave{to{opacity:0;transform:translateX(-40px) scale(.9)}}
  .request-card.forgot-card{border-left:4px solid var(--purple)}
  .request-card.forgot-card.answered{border-left-color:var(--green)}
  .request-card.forgot-card.declined{border-left-color:var(--red)}

  .card-top{display:flex;align-items:center;gap:12px}
  .avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;flex-shrink:0;box-shadow:0 2px 4px rgba(0,0,0,.1)}
  .card-info{flex:1;min-width:0}
  .card-name{font-weight:900;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-meta{font-size:11px;color:var(--gray-text);font-weight:700;margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .meta-dot{width:3px;height:3px;border-radius:50%;background:var(--gray-dark)}
  .status-badge{font-size:9px;font-weight:900;padding:4px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0;display:flex;align-items:center;gap:4px}
  .status-pending{background:var(--yellow-light);color:var(--yellow-dark)}
  .status-approved{background:var(--green-light);color:var(--green-dark)}
  .status-denied{background:var(--red-light);color:var(--red-dark)}
  .status-forgot{background:var(--purple-light);color:#7B1FA2}
  .status-answered{background:var(--green-light);color:var(--green-dark)}
  .status-declined{background:var(--red-light);color:var(--red-dark)}

  .card-actions{display:flex;gap:8px}
  .btn-action{flex:1;padding:11px 14px;border:none;border-radius:11px;font-family:inherit;font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.7px;cursor:pointer;color:#fff;transition:all .12s var(--ease);display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
  .btn-action:disabled{cursor:wait;opacity:.85}
  .btn-approve{background:var(--green);box-shadow:0 3px 0 var(--green-dark)}
  .btn-approve:hover:not(:disabled){background:#4FBA02}
  .btn-approve:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0}
  .btn-deny{background:var(--red);box-shadow:0 3px 0 var(--red-dark)}
  .btn-deny:hover:not(:disabled){background:#EA3B3B}
  .btn-deny:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0}
  .btn-revert{background:#fff;color:var(--gray-text);box-shadow:0 3px 0 var(--gray-dark);border:2px solid var(--gray);padding:9px 14px;min-height:40px}
  .btn-revert:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0}
  .btn-send{background:var(--purple);box-shadow:0 3px 0 #A855F7}
  .btn-send:hover:not(:disabled){background:#BC6BFA}
  .btn-send:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0}
  .spinner-sm{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .forgot-details{background:var(--purple-light);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:600;line-height:1.5;color:var(--text);animation:detailSlide .3s var(--ease)}
  @keyframes detailSlide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .forgot-details .label{font-weight:900;color:#7B1FA2;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;display:block}
  .forgot-details .value{color:var(--text);font-family:inherit}
  .forgot-details .value.mono{font-family:monospace;background:#fff;padding:2px 6px;border-radius:4px;display:inline-block}
  .forgot-details-row{margin-bottom:8px}
  .forgot-details-row:last-child{margin-bottom:0}

  .answer-input{width:100%;padding:11px 14px;border:2px solid var(--purple);border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;outline:none;background:#fff;transition:all .2s}
  .answer-input:focus{box-shadow:0 0 0 4px rgba(206,130,255,.2)}
  .answer-input::placeholder{font-weight:600;color:#B0B0B0}

  .empty-state{text-align:center;padding:60px 20px;display:flex;flex-direction:column;align-items:center;animation:fadeIn .4s var(--ease)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .empty-icon{font-size:60px;margin-bottom:14px;opacity:.9}
  .empty-title{font-size:16px;font-weight:900;color:var(--text);margin-bottom:6px}
  .empty-sub{font-size:12px;color:var(--gray-text);font-weight:700;max-width:260px;line-height:1.5}

  .toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:90vw;width:400px}
  .toast-notif{background:#fff;border:2px solid var(--green);border-radius:14px;padding:12px 16px;box-shadow:0 8px 24px rgba(88,204,2,.2),0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;gap:10px;animation:toastIn .45s var(--ease);pointer-events:auto}
  .toast-notif.leaving{animation:toastOut .35s var(--ease) forwards}
  @keyframes toastIn{0%{opacity:0;transform:translateY(-30px) scale(.9)}60%{transform:translateY(4px) scale(1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-30px) scale(.9)}}
  .toast-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;flex-shrink:0}
  .toast-content{flex:1;min-width:0}
  .toast-title{font-weight:900;font-size:13px;color:var(--text)}
  .toast-sub{font-size:11px;color:var(--gray-text);font-weight:700;margin-top:1px}

  .footer-info{text-align:center;padding:20px 16px;font-size:10px;color:#BBB;font-weight:700}
  .footer-info .device-id{font-family:monospace;background:#EEE;padding:2px 6px;border-radius:4px;color:#888}

  .refresh-btn{position:fixed;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--blue);border:none;cursor:pointer;box-shadow:0 4px 0 var(--blue-dark),0 6px 16px rgba(28,176,246,.3);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;transition:all .15s var(--ease);z-index:100}
  .refresh-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dark),0 2px 8px rgba(28,176,246,.2)}
  .refresh-btn.spinning{animation:rotate 1s linear infinite;pointer-events:none;opacity:.7}
  @keyframes rotate{to{transform:rotate(360deg)}}

  .confirm-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0);backdrop-filter:blur(0px);z-index:800;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:all .3s var(--ease)}
  .confirm-backdrop.show{opacity:1;pointer-events:auto;background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
  .confirm-modal{background:#fff;border-radius:20px;padding:26px 24px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);transform:scale(.85) translateY(20px);opacity:0;transition:all .4s var(--spring)}
  .confirm-backdrop.show .confirm-modal{transform:scale(1) translateY(0);opacity:1}
  .confirm-icon{font-size:44px;text-align:center;margin-bottom:12px;animation:floatIcon 2s ease-in-out infinite}
  @keyframes floatIcon{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .confirm-title{font-size:20px;font-weight:900;text-align:center;margin-bottom:8px;color:var(--text)}
  .confirm-msg{font-size:13px;color:var(--gray-text);font-weight:700;text-align:center;line-height:1.5;margin-bottom:20px}
  .confirm-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .confirm-btn{padding:13px;border:none;border-radius:11px;font-family:inherit;font-weight:900;font-size:13px;cursor:pointer;transition:all .15s}
  .confirm-btn-yes{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-dark)}
  .confirm-btn-yes:active{transform:translateY(4px);box-shadow:0 0 0}
  .confirm-btn-no{background:var(--bg);color:var(--text);border:2px solid var(--gray);box-shadow:0 4px 0 var(--gray-dark)}
  .confirm-btn-no:active{transform:translateY(4px);box-shadow:0 0 0}
  .confirm-btn-success{background:var(--green);box-shadow:0 4px 0 var(--green-dark)}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="load-mascot" id="loadMascot"></div>
  <div class="load-text">Checking access…</div>
  <div class="load-bar"><div class="load-bar-fill"></div></div>
</div>

<div class="app" id="lockedScreen">
  <div class="lock-icon">🔒</div>
  <div class="lock-title">Setup Mode</div>
  <div class="lock-sub">Send the code below to the admin. Once it's added, tap "Check Access" below.</div>

  <div class="device-card">
    <div class="device-label">Your Device Code</div>
    <div class="device-code" id="deviceCode">—</div>
    <button class="copy-btn" id="copyBtn">📋 Copy Code</button>
    <div class="lock-info">This code is permanent for this browser.</div>
  </div>

  <button class="copy-btn" id="checkBtn" style="max-width:380px;background:var(--blue);box-shadow:0 3px 0 var(--blue-dark);">✓ I've been added — Check Access</button>
  <a href="https://s0nwy.github.io/DuoLinga/" class="go-back-btn">← Back to app</a>
</div>

<div class="app" id="adminApp" style="display:none;">
  <div class="admin-header">
    <div class="header-row">
      <div class="brand">
        <div class="brand-mascot" id="brandMascot"></div>
        <div class="brand-text">
          <div class="brand-title">Danfrolat</div>
          <div class="brand-sub">Admin Panel</div>
        </div>
      </div>
      <div class="header-stats">
        <div class="stat-pill pending" id="pendingPill">⏳ <span id="pendingCount">0</span></div>
        <div class="stat-pill online"><span class="online-dot"></span> Live</div>
      </div>
    </div>
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="pending">Pending <span class="filter-count" id="countPending">0</span></button>
      <button class="filter-tab" data-filter="approved">Approved <span class="filter-count" id="countApproved">0</span></button>
      <button class="filter-tab" data-filter="denied">Denied <span class="filter-count" id="countDenied">0</span></button>
      <button class="filter-tab" data-filter="forgot">Forgot <span class="filter-count" id="countForgot">0</span></button>
      <button class="filter-tab" data-filter="all">All <span class="filter-count" id="countAll">0</span></button>
    </div>
  </div>

  <div class="feed" id="feed"></div>

  <div class="footer-info">
    Device: <span class="device-id" id="deviceIdDisplay">—</span>
  </div>

  <button class="refresh-btn" id="refreshBtn" title="Refresh">⟳</button>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="confirm-backdrop" id="confirmBackdrop">
  <div class="confirm-modal" id="confirmModal">
    <div class="confirm-icon" id="confirmIcon">⚠️</div>
    <div class="confirm-title" id="confirmTitle">Are you sure?</div>
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-row">
      <button class="confirm-btn confirm-btn-yes" id="confirmYes">Yes</button>
      <button class="confirm-btn confirm-btn-no" id="confirmNo">No</button>
    </div>
  </div>
</div>

<script>
const CLOUD_CONFIG = {
  BIN_ID: '6af727e7ac6210605a853a74',
  API_KEY: '$2a$10$0Iv/9aI8ROmnVBDmYP/W0eDFZkS22TfFItJPz07yKsEpiKuU7pLSu',
  BASE_URL: 'https://api.jsonbin.io/v3/b'
};
const MAIN_APP_URL = 'https://s0nwy.github.io/DuoLinga/';
const DEVICE_ID_KEY = 'danfrolat_device_id';

async function cloudGet() {
  try {
    const res = await fetch(`${CLOUD_CONFIG.BASE_URL}/${CLOUD_CONFIG.BIN_ID}/latest?t=${Date.now()}`, {headers:{'X-Master-Key':CLOUD_CONFIG.API_KEY}});
    if(!res.ok)return{};
    const data=await res.json();
    return data.record||{};
  } catch(e){console.error('Cloud fetch error:',e);return{};}
}
async function cloudSet(data){
  try{
    await fetch(`${CLOUD_CONFIG.BASE_URL}/${CLOUD_CONFIG.BIN_ID}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':CLOUD_CONFIG.API_KEY},body:JSON.stringify(data)});
    return true;
  }catch(e){console.error('Cloud save error:',e);return false;}
}

function mascotSVG(size=38){
  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}">
    <ellipse cx="60" cy="72" rx="42" ry="44" fill="#A0522D"/><ellipse cx="60" cy="74" rx="36" ry="38" fill="#CD853F"/><ellipse cx="60" cy="88" rx="22" ry="18" fill="#DEB887"/>
    <path d="M 48 82 Q 60 78 72 82" stroke="#A0522D" stroke-width="1.5" fill="none" opacity="0.5"/><path d="M 46 88 Q 60 84 74 88" stroke="#A0522D" stroke-width="1.5" fill="none" opacity="0.5"/><path d="M 48 94 Q 60 90 72 94" stroke="#A0522D" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M 38 38 L 32 24 L 44 34 Z" fill="#6B3410"/><path d="M 82 38 L 88 24 L 76 34 Z" fill="#6B3410"/><path d="M 40 36 L 36 28 L 44 34 Z" fill="#A0522D"/><path d="M 80 36 L 84 28 L 76 34 Z" fill="#A0522D"/>
    <circle cx="44" cy="56" r="15" fill="#DEB887"/><circle cx="76" cy="56" r="15" fill="#DEB887"/><circle cx="44" cy="56" r="12" fill="white"/><circle cx="76" cy="56" r="12" fill="white"/>

  </svg>`;
}

function getOrCreateDeviceId(){
  let id=localStorage.getItem(DEVICE_ID_KEY);
  if(!id){
    const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code='DF-';
    for(let i=0;i<4;i++)code+=c[Math.floor(Math.random()*c.length)];
    code+='-';
    for(let i=0;i<4;i++)code+=c[Math.floor(Math.random()*c.length)];
    id=code;
    localStorage.setItem(DEVICE_ID_KEY,id);
  }
  return id;
}

async function isDeviceAuthorized(deviceId){
  try{
    const data=await cloudGet();
    return (data.__admin_devices__||[]).includes(deviceId);
  }catch(e){return false;}
}

const $ = id => document.getElementById(id);
let currentFilter='pending';
let allRequests={};
let allForgot={};
let seenNames=new Set();
let initialLoadDone=false;
let pollInterval=null;
let currentDeviceId='';

function formatAgo(ts){
  const diff=Math.floor((Date.now()-ts)/1000);
  if(diff<10)return'just now';
  if(diff<60)return diff+'s ago';
  if(diff<3600)return Math.floor(diff/60)+'m ago';
  if(diff<86400)return Math.floor(diff/3600)+'h ago';
  return Math.floor(diff/86400)+'d ago';
}
function avatarColor(name){
  const colors=['#58CC02','#1CB0F6','#CE82FF','#FF9600','#FF4B4B','#2ECC71','#9C27B0','#E91E63','#FFC800'];
  let hash=0; for(let i=0;i<name.length;i++)hash=name.charCodeAt(i)+((hash<<5)-hash);
  return colors[Math.abs(hash)%colors.length];
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getInitial(name){return (name||'?').charAt(0).toUpperCase();}

function getFilteredRequests(){
  if (currentFilter === 'forgot') {
    return Object.entries(allForgot).sort((a,b)=>(b[1].timestamp||0)-(a[1].timestamp||0));
  }
  const entries=Object.entries(allRequests);
  let filtered;
  if(currentFilter==='all')filtered=entries;
  else filtered=entries.filter(([,r])=>(r.status||'pending')===currentFilter);
  return filtered.sort((a,b)=>(b[1].timestamp||0)-(a[1].timestamp||0));
}

function updateCounts(){
  const entries=Object.values(allRequests);
  const p=entries.filter(r=>(r.status||'pending')==='pending').length;
  const a=entries.filter(r=>r.status==='approved').length;
  const d=entries.filter(r=>r.status==='denied').length;
  const f=Object.values(allForgot).filter(r=>r.status==='pending').length;
  $('countPending').textContent=p;
  $('countApproved').textContent=a;
  $('countDenied').textContent=d;
  $('countForgot').textContent=f;
  $('countAll').textContent=entries.length;
  $('pendingCount').textContent=p;
}

function renderFeed(){
  const feed=$('feed');
  const filtered=getFilteredRequests();
  if(filtered.length===0){
    let emptyHtml='';
    if(currentFilter==='pending') emptyHtml=`<div class="empty-icon">🎉</div><div class="empty-title">All caught up!</div><div class="empty-sub">No pending requests right now.</div>`;
    else if(currentFilter==='approved') emptyHtml=`<div class="empty-icon">📭</div><div class="empty-title">No approved requests</div><div class="empty-sub">Approved users will show up here.</div>`;
    else if(currentFilter==='denied') emptyHtml=`<div class="empty-icon">🚫</div><div class="empty-title">No denied requests</div><div class="empty-sub">Denied users will show up here.</div>`;
    else if(currentFilter==='forgot') emptyHtml=`<div class="empty-icon">🔍</div><div class="empty-title">No forgot requests</div><div class="empty-sub">Users asking about their username will appear here.</div>`;
    else emptyHtml=`<div class="empty-icon">📭</div><div class="empty-title">No requests yet</div><div class="empty-sub">When someone requests access, they'll appear here automatically.</div>`;
    feed.innerHTML=`<div class="empty-state">${emptyHtml}</div>`;
    return;
  }
  feed.innerHTML='';
  if (currentFilter === 'forgot') {
    filtered.forEach(([deviceId, r]) => feed.appendChild(createForgotCard(deviceId, r)));
  } else {
    filtered.forEach(([name,r])=>feed.appendChild(createCard(name,r)));
  }
}

function createCard(name,r){
  const status=r.status||'pending';
  const card=document.createElement('div');
  card.className='request-card';
  card.dataset.name=name;
  const isNew=!seenNames.has(name)&&initialLoadDone;
  if(isNew)card.classList.add('new');
  seenNames.add(name);

  const statusLabels={pending:'⏳ Pending',approved:'✅ Approved',denied:'❌ Denied'};
  const statusClasses={pending:'status-pending',approved:'status-approved',denied:'status-denied'};
  const color=avatarColor(name);
  const initial=getInitial(name);
  const ago=r.timestamp?formatAgo(r.timestamp):'';
  const takeover = r.isTakeover ? ' <span style="color:var(--purple);font-weight:900;">• TAKEOVER</span>' : '';

  let actionsHtml='';
  if(status==='pending'){
    actionsHtml=`<div class="card-actions"><button class="btn-action btn-approve" data-action="approve" data-name="${escapeHtml(name)}">✓ Approve</button><button class="btn-action btn-deny" data-action="deny" data-name="${escapeHtml(name)}">✕ Deny</button></div>`;
  } else {
    actionsHtml=`<div class="card-actions"><button class="btn-action btn-revert" data-action="revert" data-name="${escapeHtml(name)}">↺ Move to Pending</button></div>`;
  }

  card.innerHTML=`
    <div class="card-top">
      <div class="avatar" style="background:${color};">${initial}</div>
      <div class="card-info">
        <div class="card-name">${escapeHtml(name)}</div>
        <div class="card-meta">${ago?`<span>${ago}</span><span class="meta-dot"></span>`:''}<span>${status}</span>${takeover}</div>
      </div>
      <div class="status-badge ${statusClasses[status]}">${statusLabels[status]}</div>
    </div>
    ${actionsHtml}
  `;

  card.querySelectorAll('button[data-action]').forEach(btn=>{
    btn.addEventListener('click',()=>handleAction(btn,card));
  });
  return card;
}

function createForgotCard(deviceId, r){
  const card=document.createElement('div');
  card.className='request-card forgot-card';
  card.dataset.deviceId = deviceId;
  if (r.status === 'answered') card.classList.add('answered');
  if (r.status === 'declined') card.classList.add('declined');

  const color=avatarColor(r.name||'?');
  const initial=getInitial(r.name||'?');
  const ago=r.timestamp?formatAgo(r.timestamp):'';

  const statusMap = {
    pending: { label: '⏳ Needs Review', cls: 'status-forgot' },
    answered: { label: '✅ Sent', cls: 'status-answered' },
    declined: { label: '❌ Declined', cls: 'status-declined' }
  };
  const st = statusMap[r.status] || statusMap.pending;

  let actionsHtml = '';
  if (r.status === 'pending') {
    actionsHtml = `
      <input type="text" class="answer-input" placeholder="Enter their real username..." data-forgot-input="${deviceId}" autocomplete="off" />
      <div class="card-actions">
        <button class="btn-action btn-send" data-forgot-action="send" data-device="${deviceId}">📨 Send Username</button>
        <button class="btn-action btn-deny" data-forgot-action="decline" data-device="${deviceId}">✕ Decline</button>
      </div>
    `;
  } else if (r.status === 'answered') {
    actionsHtml = `<div class="forgot-details"><div class="forgot-details-row"><span class="label">Sent Username</span><span class="value mono">${escapeHtml(r.answer||'')}</span></div></div>`;
  } else {
    actionsHtml = `<div class="forgot-details"><div class="forgot-details-row"><span class="label">Status</span><span class="value">Declined — user was notified</span></div></div>`;
  }

  card.innerHTML=`
    <div class="card-top">
      <div class="avatar" style="background:${color};">${initial}</div>
      <div class="card-info">
        <div class="card-name">${escapeHtml(r.name || 'Unknown')}</div>
        <div class="card-meta">${ago?`<span>${ago}</span><span class="meta-dot"></span>`:''}<span>Forgot username</span></div>
      </div>
      <div class="status-badge ${st.cls}">${st.label}</div>
    </div>
    <div class="forgot-details">
      <div class="forgot-details-row">
        <span class="label">Remembered</span>
        <span class="value">"${escapeHtml(r.remembered||'—')}"</span>
      </div>
      ${r.explanation ? `<div class="forgot-details-row"><span class="label">Explanation</span><span class="value">${escapeHtml(r.explanation)}</span></div>` : ''}
    </div>
    ${actionsHtml}
  `;

  const input = card.querySelector(`input[data-forgot-input="${deviceId}"]`);
  const sendBtn = card.querySelector(`button[data-forgot-action="send"]`);
  if (input && sendBtn) {
    const updateBtn = () => { sendBtn.disabled = input.value.trim().length === 0; };
    sendBtn.disabled = true;
    input.addEventListener('input', updateBtn);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !sendBtn.disabled) sendBtn.click(); });
  }

  card.querySelectorAll('button[data-forgot-action]').forEach(btn => {
    btn.addEventListener('click', () => handleForgotAction(btn, card));
  });

  return card;
}

async function handleAction(btn,card){
  const action=btn.dataset.action;
  const name=btn.dataset.name;
  const originalText=btn.innerHTML;
  btn.disabled=true;
  btn.innerHTML='<span class="spinner-sm"></span>';

  try{
    let newStatus;
    if(action==='approve')newStatus='approved';
    else if(action==='deny')newStatus='denied';
    else if(action==='revert')newStatus='pending';

    const data=await cloudGet();
    if(!data.__requests__)data.__requests__={};
    data.__requests__[name]={
      ...data.__requests__[name],
      status:newStatus,
      timestamp:Date.now(),
      name
    };
    const ok=await cloudSet(data);
    if(!ok)throw new Error('Cloud write failed');
    card.classList.add('removing');
    setTimeout(async()=>{await refresh();},350);
  }catch(e){
    console.error('Action error:',e);
    btn.disabled=false;
    btn.innerHTML=originalText;
    showToast({name,color:'#FF4B4B',title:'Action failed',sub:'Could not reach server'});
  }
}

function handleForgotAction(btn, card) {
  const action = btn.dataset.forgotAction;
  const deviceId = btn.dataset.device;
  const record = allForgot[deviceId];
  if (!record) return;

  if (action === 'send') {
    const input = card.querySelector(`input[data-forgot-input="${deviceId}"]`);
    const answer = input ? input.value.trim() : '';
    if (!answer) {
      showToast({ name: '?', color: '#FF4B4B', title: 'Enter a username', sub: 'You need to type their real username first.' });
      return;
    }
    showConfirm({
      icon: '📨',
      title: 'Send this username?',
      message: `Send "${answer}" to ${record.name}? They will see it next time they open the app.`,
      yesLabel: 'Send',
      success: true,
      onYes: async () => {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-sm"></span>';
        try {
          const data = await cloudGet();
          if (!data.__forgot__) data.__forgot__ = {};
          data.__forgot__[deviceId] = {
            ...data.__forgot__[deviceId],
            status: 'answered',
            answer: answer,
            read: false,
            answeredAt: Date.now()
          };
          await cloudSet(data);
          card.classList.add('removing');
          setTimeout(async()=>{await refresh();}, 350);
          showToast({ name: record.name, color: '#58CC02', title: 'Sent!', sub: `Username sent to ${record.name}` });
        } catch (e) {
          btn.disabled = false;
          btn.innerHTML = '📨 Send Username';
          showToast({ name: '?', color: '#FF4B4B', title: 'Error', sub: 'Could not send.' });
        }
      }
    });
  }

  if (action === 'decline') {
    showConfirm({
      icon: '⚠️',
      title: 'Decline this request?',
      message: `This will notify ${record.name} that we couldn't verify their identity.`,
      yesLabel: 'Decline',
      success: false,
      onYes: async () => {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-sm"></span>';
        try {
          const data = await cloudGet();
          if (!data.__forgot__) data.__forgot__ = {};
          data.__forgot__[deviceId] = {
            ...data.__forgot__[deviceId],
            status: 'declined',
            read: false,
            declinedAt: Date.now()
          };
          await cloudSet(data);
          card.classList.add('removing');
          setTimeout(async()=>{await refresh();}, 350);
          showToast({ name: record.name, color: '#FF4B4B', title: 'Declined', sub: `Notified ${record.name}` });
        } catch (e) {
          btn.disabled = false;
          btn.innerHTML = '✕ Decline';
          showToast({ name: '?', color: '#FF4B4B', title: 'Error', sub: 'Could not decline.' });
        }
      }
    });
  }
}

function showConfirm({ icon, title, message, yesLabel, success, onYes }) {
  const backdrop = $('confirmBackdrop');
  $('confirmIcon').textContent = icon;
  $('confirmTitle').textContent = title;
  $('confirmMsg').textContent = message;
  const yesBtn = $('confirmYes');
  yesBtn.textContent = yesLabel || 'Yes';
  yesBtn.className = 'confirm-btn ' + (success ? 'confirm-btn-success' : 'confirm-btn-yes');
  backdrop.classList.add('show');

  const close = () => {
    backdrop.classList.remove('show');
    yesBtn.onclick = null;
    $('confirmNo').onclick = null;
  };

  yesBtn.onclick = () => { close(); onYes && onYes(); };
  $('confirmNo').onclick = close;
  backdrop.onclick = (e) => { if (e.target === backdrop) close(); };
}

function showToast({name,color,title,sub}){
  const container=$('toastContainer');
  const toast=document.createElement('div');
  toast.className='toast-notif';
  toast.innerHTML=`<div class="toast-avatar" style="background:${color||avatarColor(name||'?')}">${getInitial(name||'?')}</div><div class="toast-content"><div class="toast-title">${escapeHtml(title)}</div><div class="toast-sub">${escapeHtml(sub)}</div></div>`;
  container.appendChild(toast);
  setTimeout(()=>{toast.classList.add('leaving');setTimeout(()=>toast.remove(),400);},4000);
}

async function refresh(){
  try{
    const data=await cloudGet();
    const requests=data.__requests__||{};
    const forgot=data.__forgot__||{};
    const prevNames=new Set(Object.keys(allRequests));
    const newNames=[];
    Object.entries(requests).forEach(([name,r])=>{
      if(!prevNames.has(name)&&initialLoadDone&&(r.status||'pending')==='pending'){
        newNames.push(name);
      }
    });
    const prevForgot=new Set(Object.keys(allForgot));
    const newForgot=[];
    Object.entries(forgot).forEach(([id,r])=>{
      if(!prevForgot.has(id)&&initialLoadDone&&r.status==='pending'){
        newForgot.push(r);
      }
    });
    allRequests=requests;
    allForgot=forgot;
    updateCounts();
    renderFeed();
    newNames.forEach(name=>{
      showToast({name,color:avatarColor(name),title:'New request!',sub:`${name} wants access`});
    });
    newForgot.forEach(r=>{
      showToast({name:r.name||'?',color:'#CE82FF',title:'Forgot request!',sub:`${r.name||'Someone'} needs help finding their username`});
    });
    if(newNames.length>0){
      const pill=$('pendingPill');
      pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump');
    }
    initialLoadDone=true;
  }catch(e){console.error('Refresh error:',e);}
}

function startPolling(){
  if(pollInterval)clearInterval(pollInterval);
  pollInterval=setInterval(refresh,5000);
}

$('loadMascot').innerHTML=mascotSVG(100);
$('brandMascot').innerHTML=mascotSVG(38);

document.querySelectorAll('.filter-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter=tab.dataset.filter;
    renderFeed();
  });
});

$('refreshBtn').addEventListener('click',async()=>{
  const btn=$('refreshBtn');
  btn.classList.add('spinning');
  await refresh();
  setTimeout(()=>btn.classList.remove('spinning'),400);
});

$('copyBtn').addEventListener('click',async()=>{
  const code=currentDeviceId;
  const btn=$('copyBtn');
  try{ await navigator.clipboard.writeText(code); }
  catch(e){
    const ta=document.createElement('textarea');
    ta.value=code; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  btn.textContent='✓ Copied!';
  btn.classList.add('copied');
  setTimeout(()=>{btn.textContent='📋 Copy Code';btn.classList.remove('copied');},2000);
});

$('checkBtn').addEventListener('click',async()=>{
  const btn=$('checkBtn');
  const orig=btn.innerHTML;
  btn.disabled=true;
  btn.innerHTML='<span class="spinner-sm" style="border-color:rgba(255,255,255,.4);border-top-color:#fff;"></span> Checking…';
  const authorized=await isDeviceAuthorized(currentDeviceId);
  if(authorized){
    btn.style.background='var(--green)';
    btn.style.boxShadow='0 3px 0 var(--green-dark)';
    btn.innerHTML='✓ Access granted!';
    setTimeout(()=>window.location.reload(),600);
  } else {
    btn.disabled=false;
    btn.innerHTML=orig;
    showToast({name:'?',color:'#FFC800',title:'Not added yet',sub:'Ask the admin to add your code, then try again'});
  }
});

async function boot(){
  currentDeviceId=getOrCreateDeviceId();
  const params=new URLSearchParams(window.location.search);
  const isSetupMode=params.has('setup');
  const authorized=await isDeviceAuthorized(currentDeviceId);

  $('loadingScreen').classList.add('hide');
  setTimeout(()=>$('loadingScreen').remove(),400);

  if(authorized){
    $('adminApp').style.display='block';
    $('deviceIdDisplay').textContent=currentDeviceId;
    await refresh();
    startPolling();
    return;
  }

  if(isSetupMode){
    $('deviceCode').textContent=currentDeviceId;
    $('lockedScreen').classList.add('show');
    return;
  }

  window.location.replace(MAIN_APP_URL);
}

boot();
</script>
